<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 — PlayPop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css" />
<style>
  .game-sky{
    min-height: 100vh;
    padding: 40px 20px 90px;
    display: flex;
    justify-content: center;
    background:
      radial-gradient(circle at 78% 88%, rgba(255,138,91,0.55), transparent 45%),
      radial-gradient(circle at 12% 92%, rgba(255,210,62,0.35), transparent 40%),
      linear-gradient(165deg, #241246 0%, #4A1E6E 22%, #90298E 46%, #C93E8A 68%, #E8636B 84%, #F3934F 100%);
  }

  .game-panel{
    width: 100%;
    max-width: 460px;
    background:
      radial-gradient(circle at 15% 0%, rgba(123,94,255,0.20), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(255,62,165,0.16), transparent 50%),
      var(--panel-bg);
    border-radius: 32px;
    border: 1.5px solid rgba(255,255,255,0.10);
    padding: 22px 20px 28px;
    box-shadow:
      0 0 0 1px rgba(255,62,165,0.25),
      0 0 40px rgba(255,62,165,0.35),
      0 0 90px rgba(123,94,255,0.25),
      0 30px 60px rgba(0,0,0,0.45);
  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--panel-text-soft);
    margin-bottom: 18px;
  }
  .back-link:hover{ color: var(--pink); }

  .game-head{
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .game-head h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 2rem;
    margin: 0;
    color: var(--panel-text);
  }
  .game-head p{
    margin: 4px 0 0;
    color: var(--panel-text-soft);
    font-size: 0.82rem;
  }

  .score-panel{
    display: flex;
    gap: 10px;
  }
  .score-box{
    background: var(--panel-bg-2);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label{
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--panel-text-soft);
  }
  .score-box .value{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.25rem;
    color: var(--yellow);
  }

  .controls-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .hint{
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--panel-text-soft);
  }
  .new-game-btn{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 0.8rem;
    background: linear-gradient(120deg, var(--pink), var(--purple));
    color: white;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .new-game-btn:hover{ transform: translateY(-2px); }
  .new-game-btn:focus-visible{ outline: 2px solid var(--pink); outline-offset: 3px; }

  .board-frame{
    position: relative;
    background: var(--panel-bg-2);
    border: 1px solid var(--panel-line);
    border-radius: 20px;
    padding: 10px;
    touch-action: none;
    user-select: none;
  }

  .board{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
  }

  .cell-bg{
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
  }

  .tile{
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-family: var(--font-display);
    font-weight: 600;
    transition: top 0.12s ease, left 0.12s ease, transform 0.12s ease;
  }

  .tile[data-pop="1"]{ animation: pop 0.14s ease; }
  @keyframes pop{
    0%{ transform: scale(0.6); }
    100%{ transform: scale(1); }
  }

  .overlay{
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    background: rgba(16,12,30,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show{ display: flex; }
  .overlay h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    background: linear-gradient(120deg, var(--pink), var(--yellow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p{
    color: var(--panel-text-soft);
    font-size: 0.85rem;
    margin: 0;
  }

  .swipe-hint{
    margin-top: 16px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--panel-text-soft);
  }
</style>
</head>
<body>

  <section class="game-sky">
    <div class="game-panel">

      <a class="back-link" href="../../index.html">&larr; all games</a>

      <div class="game-head">
        <div>
          <h1>2048</h1>
          <p>Merge tiles. Chase the number.</p>
        </div>
        <div class="score-panel">
          <div class="score-box">
            <div class="label">Score</div>
            <div class="value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="label">Best</div>
            <div class="value" id="best">0</div>
          </div>
        </div>
      </div>

      <div class="controls-row">
        <span class="hint">arrow keys on desktop &middot; swipe on mobile</span>
        <button class="new-game-btn" id="newGame">New game</button>
      </div>

      <div class="board-frame">
        <div class="board" id="board"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Game over</h2>
          <p id="overlaySub">No more moves left.</p>
          <button class="new-game-btn" id="overlayRestart">Try again</button>
        </div>
      </div>

      <p class="swipe-hint">tiles with the same number merge into one when they touch</p>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
