<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain Bike Climb — PlayPop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #16122d, #34205c);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-container {
  width: min(95vw, 650px);
  text-align: center;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.back {
  color: #aaa;
  text-decoration: none;
  font-size: 14px;
}

h1 {
  font-size: 27px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 12px;
}

.stat {
  background: #211b3c;
  border: 1px solid #3b315c;
  padding: 8px 15px;
  border-radius: 10px;
}

.stat span {
  display: block;
  font-size: 11px;
  color: #aaa;
}

.stat strong {
  font-size: 18px;
}

#game {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: block;
  background: #76c9ed;
  border-radius: 18px;
  border: 2px solid #44366c;
  touch-action: none;
}

button {
  margin-top: 14px;
  border: none;
  background: linear-gradient(90deg, #ff3ea5, #7b5eff);
  color: white;
  padding: 12px 28px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 12px;
}

.control {
  width: 80px;
  height: 50px;
  margin: 0;
  font-size: 22px;
  padding: 0;
}

.hint {
  color: #aaa;
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="game-container">

  <div class="top">
    <a class="back" href="../../">← PlayPop</a>
    <h1>🏍️ Mountain Climb</h1>
  </div>

  <div class="stats">

    <div class="stat">
      <span>DISTANCE</span>
      <strong id="distance">0</strong>
    </div>

    <div class="stat">
      <span>COINS</span>
      <strong id="coins">0</strong>
    </div>

    <div class="stat">
      <span>BEST</span>
      <strong id="best">0</strong>
    </div>

  </div>

  <canvas id="game"></canvas>

  <button id="startBtn">Start Climb</button>

  <div class="controls">
    <button class="control" id="backBtn">←</button>
    <button class="control" id="forwardBtn">→</button>
  </div>

  <p class="hint">
    Use ← → on desktop or swipe on mobile
  </p>

</div>

<script src="game.js"></script>

</body>
</html>
