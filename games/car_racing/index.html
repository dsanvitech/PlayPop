<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Racing — PlayPop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #17122d, #33205c);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-container {
  width: min(95vw, 500px);
  text-align: center;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.back {
  color: #aaa;
  text-decoration: none;
  font-size: 14px;
}

h1 {
  font-size: 28px;
}

.stats {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 12px;
}

.stat {
  background: #211b3c;
  border: 1px solid #3b315c;
  padding: 8px 15px;
  border-radius: 10px;
}

.stat span {
  display: block;
  font-size: 11px;
  color: #aaa;
}

.stat strong {
  font-size: 18px;
}

#game {
  width: 100%;
  aspect-ratio: 3 / 5;
  display: block;
  background: #222;
  border-radius: 18px;
  border: 2px solid #44366c;
  touch-action: none;
}

button {
  margin-top: 14px;
  border: none;
  background: linear-gradient(90deg, #ff3ea5, #7b5eff);
  color: white;
  padding: 12px 28px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 35px;
  margin-top: 12px;
}

.control {
  width: 65px;
  height: 50px;
  margin: 0;
  font-size: 24px;
  padding: 0;
}

.hint {
  color: #aaa;
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="game-container">

  <div class="top">
    <a class="back" href="../../">← PlayPop</a>
    <h1>🏎️ Car Racing</h1>
  </div>

  <div class="stats">
    <div class="stat">
      <span>SCORE</span>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <span>BEST</span>
      <strong id="best">0</strong>
    </div>
  </div>

  <canvas id="game"></canvas>

  <button id="startBtn">Start Race</button>

  <div class="controls">
    <button class="control" id="leftBtn">←</button>
    <button class="control" id="rightBtn">→</button>
  </div>

  <p class="hint">Use ← → on desktop or swipe on mobile</p>

</div>

<script src="game.js"></script>
</body>
</html>
